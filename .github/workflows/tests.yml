# Tests de MyCMS à chaque push sur une branche : Python (pytest) et interface (node --test).
# Sous Windows, comme les postes des utilisateurs (verrou NTFS d'auth.json, fins de ligne CRLF).
# Une seule exécution par commit : une pull request affiche le résultat du push de sa branche, et
# les tags sont testés par release.yml.
name: Tests

on:
  push:
    branches: ["**"]

jobs:
  tests:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: cms/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cms/web/package-lock.json

      - name: Dépendances
        run: |
          python -m pip install -r cms/requirements-dev.txt
          npm ci --prefix cms/web

      - name: Tests Python
        run: python -m pytest -v

      - name: Tests de l'interface
        run: npm test --prefix cms/web
