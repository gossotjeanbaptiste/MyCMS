# Tests de MyCMS à chaque push et pull request : Python (pytest) et interface (node --test).
# Sous Windows, comme les postes de l'auto-école (verrou NTFS d'auth.json, fins de ligne CRLF).
name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: cms/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cms/web/package-lock.json

      - name: Dépendances
        run: |
          python -m pip install -r cms/requirements-dev.txt
          npm ci --prefix cms/web

      - name: Tests Python
        run: python -m pytest -v

      - name: Tests de l'interface
        run: npm test --prefix cms/web
