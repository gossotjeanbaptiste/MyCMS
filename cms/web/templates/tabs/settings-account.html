<!-- Compte connecté : nom et e-mail qui signent ses publications -->
<div class="card">
    <span class="card-title">Mon compte</span>
    <p class="text-muted">Vos publications sur GitHub sont signées de ce nom : l'historique de l'onglet Git montre qui a modifié quoi.</p>
    <label for="account-name" class="card-title">Nom affiché</label>
    <input id="account-name" type="text" class="input max-w-md" autocomplete="name" maxlength="100" placeholder="Exemple : Marie Dupont (vide = votre identifiant)">
    <label for="account-email" class="card-title">E-mail (facultatif)</label>
    <input id="account-email" type="email" class="input max-w-md" autocomplete="email" spellcheck="false" placeholder="Exemple : marie@rout-art.fr">
    <p id="account-author" class="text-xs text-muted"></p>
    <div class="mt-1 flex flex-wrap gap-2">
        <button id="account-save" class="btn">Enregistrer</button>
    </div>
</div>
